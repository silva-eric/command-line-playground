<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command line playground</title>
<style>
@font-face{font-family:"Inter";src:url("fonts/Inter-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url("fonts/Inter-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url("fonts/Inter-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
</style>
<meta name="description" content="A practice terminal for learning the command line. Type real commands and watch the file system tree change as you go. Runs entirely in your browser.">
<style>
:root{
  --bg:#FFFFFF; --panel:#F4F4F5; --ink:#000000; --muted:#6B6B6B; --line:#BDBDBD; --dirbg:#000000; --dirink:#FFFFFF; --fileline:#3F3F46; --sysbg:#E4E4E7; --sysline:#A1A1AA; --sysink:#52525B;
  --box:#FFFFFF; --boxline:#D4D4D8; --red:#FF002E; --pink:#FFF0F3;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--panel:#1A1A1A;--ink:#FFFFFF;--muted:#A1A1AA;--line:#52525B;--box:#000000;--boxline:#3F3F46;--pink:#2A0A12;--dirbg:#FFFFFF;--dirink:#000000;--fileline:#D4D4D8;--sysbg:#27272A;--sysline:#71717A;--sysink:#A1A1AA;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--panel:#1A1A1A;--ink:#FFFFFF;--muted:#A1A1AA;--line:#52525B;--box:#000000;--boxline:#3F3F46;--pink:#2A0A12;--dirbg:#FFFFFF;--dirink:#000000;--fileline:#D4D4D8;--sysbg:#27272A;--sysline:#71717A;--sysink:#A1A1AA;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--boxline);background:var(--bg)}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
h1 .accent{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:10px;vertical-align:1px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--boxline);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.seg button+button{border-left:1px solid var(--boxline)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.name{font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:center}
label.name input{font:400 15px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;width:10em;padding:7px 10px;border:1px solid var(--boxline);border-radius:8px;background:var(--bg);color:var(--ink)}
button.reset{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1px solid var(--boxline);background:var(--bg);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,2fr) 3fr}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:minmax(280px,1fr) minmax(320px,1fr)}}
/* terminal: always dark, like a real one */
.term{background:#000;color:#E4E4E7;font:400 18px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;padding:16px 20px 24px;overflow-y:auto;border-left:6px solid var(--red);cursor:text;min-height:0}
.term .l{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.term .note{color:#A1A1AA}
.term .err{color:#FF99AD}
.term .u{color:#8AE234;font-weight:700} .term .p{color:#729FCF;font-weight:700}
.mac .term .u,.mac .term .p{color:#E4E4E7;font-weight:400}
.term .d{color:#729FCF;font-weight:700} .mac .term .d{color:#E4E4E7}
.row{white-space:pre-wrap;word-break:break-all;min-height:1.5em}
.term .cmdl{word-break:break-all}
.row #typed{color:#FFF}
#cmd{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;resize:none;overflow:hidden;border:0;padding:0;font:inherit}
.caret{background:#E4E4E7;color:#000;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{background:transparent;color:#FFF}}
.term:not(:focus-within) .caret{animation:none;background:transparent;color:#FFF;outline:1px solid #E4E4E7;outline-offset:-1px}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
/* tree */
.treepane{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#tree{flex:1;min-height:0;padding:10px 12px 6px}
#tree svg{width:100%;height:100%;display:block}
.edge{stroke:var(--line);stroke-width:2.5;fill:none}
.node rect{fill:var(--box);stroke:var(--boxline);stroke-width:2;transform-box:fill-box;transform-origin:center}
.node.dir rect{fill:var(--dirbg);stroke:var(--dirbg)}
.node.file rect{stroke:var(--fileline)}
.node .icon{fill:var(--dirink)}
.node.file .icon{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.node text{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:18px;fill:var(--ink);dominant-baseline:central;text-anchor:middle}
.node.dir text{font-weight:700;fill:var(--dirink)}
.node.here rect{fill:var(--red);stroke:var(--red)}
.node.here text{fill:#FFFFFF}
.node.sys rect{fill:var(--sysbg);stroke:var(--sysline);stroke-dasharray:6 5}
.node.sys text{fill:var(--sysink)}
.node.sys .icon{fill:var(--sysink)}
.node.sys.file .icon{fill:none;stroke:var(--sysink)}
.node.here .icon{fill:#FFFFFF}
.node.sys.here rect{fill:var(--red);stroke:var(--red);stroke-dasharray:none}
.node.sys.here text{fill:#FFFFFF}
.node.new rect{animation:pop .9s ease-out}
.node.changed rect{animation:ring 1.3s ease-out}
.node.leaving,.edge.leaving{animation:leave .85s ease-in forwards}
.node.leaving rect{stroke:var(--red);stroke-dasharray:6 4}
@keyframes pop{0%{transform:scale(.4);stroke:var(--red);stroke-width:6}60%{transform:scale(1.08);stroke:var(--red);stroke-width:6}100%{transform:scale(1)}}
@keyframes ring{0%,45%{stroke:var(--red);stroke-width:7}100%{stroke-width:2}}
@keyframes leave{0%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.dot{fill:var(--red);stroke:#FFFFFF;stroke-width:4}
.trail{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.node text.perm{font-size:16px;font-weight:400;fill:var(--muted)}
.node.dir text.perm{fill:var(--dirink);opacity:.75}
.node.here text.perm{fill:#FFFFFF;opacity:.85}
.term{position:relative}
.pager{position:absolute;inset:0;background:#000;color:#E4E4E7;display:flex;flex-direction:column;border-left:6px solid var(--red);z-index:5}
.pager pre{flex:1;margin:0;padding:16px 20px;overflow:hidden;font:inherit;white-space:pre-wrap;word-break:break-word}
.pager pre b{color:#FFFFFF}
.pager .bar{background:#E4E4E7;color:#000;padding:2px 20px;white-space:pre-wrap;word-break:break-word}
button.toggle{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1px solid var(--boxline);background:var(--bg);color:var(--ink);cursor:pointer}
button.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--boxline);font-size:16px}
.key{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.sw{width:18px;height:14px;border-radius:4px;border:2px solid var(--boxline);background:var(--box)}
.sw.here{background:var(--red);border-color:var(--red)} .sw.sys{background:var(--sysbg);border:2px dashed var(--sysline)}
.ico{flex:none;overflow:visible} .ico.dir{fill:var(--dirbg)} .ico.file{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#last{margin-left:auto;font-weight:700}
#last.del{color:var(--red)}
.term .pct{background:#E4E4E7;color:#000}
.term.full{overflow:hidden}
.editor{position:absolute;inset:0;background:#000;color:#E4E4E7;display:flex;flex-direction:column;border-left:6px solid var(--red);z-index:6}
.editor .ebar{display:flex;justify-content:space-between;gap:12px;background:#E4E4E7;color:#000;padding:0 12px;white-space:pre-wrap}
.editor textarea{flex:1;min-height:0;margin:0;padding:6px 20px;border:0;outline:none;resize:none;background:#000;color:#E4E4E7;font:inherit;tab-size:8;white-space:pre-wrap;word-break:break-word;caret-color:#E4E4E7}
.editor .ehelp{flex:1;margin:0;padding:6px 20px;overflow:auto;font:inherit;white-space:pre-wrap;word-break:break-word}
.editor .emsg{min-height:1.5em;text-align:center;padding:0 12px}
.editor .emsg>span{background:#E4E4E7;color:#000}
.editor .eask{display:flex;text-align:left;background:#E4E4E7;color:#000;white-space:pre}
.editor .eask input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:inherit;font:inherit;padding:0}
.editor .ekeys{display:grid;grid-template-columns:repeat(auto-fill,minmax(15ch,1fr));padding:0 12px 4px;white-space:pre}
.editor .ekeys b{background:#E4E4E7;color:#000;font-weight:400}
@media (prefers-reduced-motion:reduce){.node rect,.node.leaving,.edge.leaving{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="accent" aria-hidden="true"></span>Command line playground</h1>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Laptop">
    <button type="button" data-os="ubuntu" aria-pressed="true">Ubuntu · WSL</button>
    <button type="button" data-os="mac" aria-pressed="false">Mac</button>
  </div>
  <label class="name">Your name <input id="user" value="yourname" spellcheck="false" autocomplete="off" aria-label="Username shown in the prompt"></label>
  <button type="button" class="toggle" id="perms" aria-pressed="false">Show permissions</button>
  <button type="button" class="reset" id="reset">Start again</button>
</header>
<main>
  <section class="term" id="term" aria-label="Practice terminal">
    <div id="out" aria-live="polite"></div>
    <div class="row" aria-hidden="true"><span id="ps"></span><span id="typed"></span></div>
    <textarea id="cmd" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Type a command"></textarea>
  </section>
  <section class="treepane" aria-label="The file system as a tree">
    <div id="tree"></div>
    <div class="status">
      <span class="key"><span class="sw here"></span>You are here</span>
      <span class="key"><svg class="ico dir" viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M0 2a2 2 0 0 1 2-2h5l2 2.5h9a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z"/></svg>Folder</span>
      <span class="key"><svg class="ico file" viewBox="-1 -1 16 20" width="16" height="20" aria-hidden="true"><path d="M0 0h8l6 6v12H0zM8 0v6h6"/></svg>File</span>
      <span class="key"><span class="sw sys"></span>System (look, don’t touch)</span>
      <span id="last" role="status"></span>
    </div>
  </section>
</main>
<script>
/* ---------- manual pages (plain-language, for the commands this terminal supports) ---------- */
const MAN = {
 ls:{n:'list what is inside a folder', s:['ls [-a] [-l] [-R] [FILE]...'], d:['Lists the files and folders inside each FILE you name. With no FILE, lists the folder you are in.','Names are listed in alphabetical order; on Ubuntu, folders are shown in colour. Names that start with a dot are hidden unless you use -a.'],
  o:[['-a','show everything, including hidden names that start with a dot, and the . and .. entries'],['-l','long format: permissions, owner, size and date on one line per entry'],['-R','list each folder, then every folder inside it, all the way down']],
  e:[['ls','list the folder you are in'],['ls -la ~','everything in your home folder, in detail'],['ls notes | wc -l','count the entries in notes']], see:'cd, pwd, find, tree'},
 pwd:{n:'print the name of the folder you are in', s:['pwd'], d:['Prints the full, absolute path of your current folder, starting from the root, /.'], e:[['pwd','for example /home/yourname/projects']], see:'cd, ls'},
 mkdir:{n:'make folders', s:['mkdir [-p] FOLDER...'], d:['Creates each FOLDER. It is an error if the folder already exists, or if the folder it should go in does not exist.'],
  o:[['-p','make any missing parent folders as well, and do not complain if the folder already exists']], e:[['mkdir notes','make one folder'],['mkdir -p a/b/c','make a, then b inside it, then c inside that']], see:'rmdir, rm'},
 rmdir:{n:'remove empty folders', s:['rmdir FOLDER...'], d:['Removes each FOLDER, but only if it is empty. To remove a folder and everything in it, see rm -r.'], e:[['rmdir old','remove the empty folder old']], see:'rm, mkdir'},
 touch:{n:'create an empty file, or update its time', s:['touch FILE...'], d:['If FILE does not exist, creates it, empty. If it does, updates its "last modified" time and leaves the contents alone.'], e:[['touch notes/todo.txt','create an empty file inside notes']], see:'echo, cat'},
 cp:{n:'copy files and folders', s:['cp [-r] SOURCE DEST'], d:['Copies SOURCE to DEST. If DEST is an existing folder, the copy goes inside it with the same name.','Remember the order: from, then to.'],
  o:[['-r','copy a folder and everything inside it']], e:[['cp todo.txt copy.txt','make a copy next to the original'],['cp -r notes backup','copy the whole notes folder']], see:'mv, rm'},
 mv:{n:'move or rename files and folders', s:['mv SOURCE DEST'], d:['Moves SOURCE to DEST. If DEST is an existing folder, SOURCE moves inside it. If not, SOURCE is renamed to DEST.','There is no separate rename command: renaming is moving within the same folder.'],
  e:[['mv copy.txt done.txt','rename a file'],['mv done.txt archive/','move it into the archive folder']], see:'cp, rm'},
 rm:{n:'remove files or folders', s:['rm [-i] [-r] [-f] FILE...'], d:['Removes each FILE. There is no bin and no undo: what rm removes is gone.','Folders are only removed with -r.'],
  o:[['-i','ask before each removal; answer y to remove'],['-r','remove folders and everything inside them'],['-f','never ask, and stay quiet about files that do not exist']],
  e:[['rm -i done.txt','asks before removing'],['rm -r old','removes old and everything in it']], see:'rmdir, mv'},
 cat:{n:'print the contents of files', s:['cat [FILE]...'], d:['Prints each FILE, one after another. The name comes from "concatenate": cat can join files together.','With no FILE, cat reads what comes in through a pipe.'],
  e:[['cat notes/todo.txt','show one file'],['cat a.txt b.txt > both.txt','join two files into a third']], see:'less, head, tail'},
 less:{n:'read a file one screen at a time', s:['less FILE'], d:['Opens FILE in a viewer you can scroll. The same viewer shows these manual pages.'],
  o:[['↓  j  Enter','down one line'],['↑  k','up one line'],['space','down one screen'],['b','up one screen'],['g  G','jump to the top or the end'],['q','quit']], e:[['less notes/todo.txt','read a file'],['ls -l | less','scroll through long output']], see:'more, cat, man'},
 more:{n:'read a file one screen at a time (the older viewer)', s:['more FILE'], d:['The older cousin of less. In this terminal it works exactly like less: scroll with the arrow keys or space, quit with q.'], see:'less, cat'},
 head:{n:'print the first lines of a file', s:['head [-n NUMBER] [FILE]...'], d:['Prints the first 10 lines of each FILE, or of what comes in through a pipe.'], o:[['-n NUMBER','print the first NUMBER lines instead (head -3 is short for head -n 3)']], e:[['head -n 3 list.txt','the first three lines']], see:'tail, cat'},
 tail:{n:'print the last lines of a file', s:['tail [-n NUMBER] [FILE]...'], d:['Prints the last 10 lines of each FILE, or of what comes in through a pipe.'], o:[['-n NUMBER','print the last NUMBER lines instead']], e:[['tail -n 2 list.txt','the last two lines']], see:'head, cat'},
 wc:{n:'count lines, words and characters', s:['wc [-l] [-w] [-c] [FILE]...'], d:['Prints how many lines, words and bytes are in each FILE, or in what comes in through a pipe.'],
  o:[['-l','lines only'],['-w','words only'],['-c','bytes only']], e:[['wc -l todo.txt','how many lines'],['ls | wc -l','how many entries in this folder']], see:'grep, sort'},
 grep:{n:'print the lines that match a pattern', s:['grep [-i] [-v] [-n] [-c] PATTERN [FILE]...'], d:['Searches each FILE, or what comes in through a pipe, and prints every line that contains PATTERN.'],
  o:[['-i','ignore the difference between capitals and small letters'],['-v','print the lines that do NOT match'],['-n','put the line number in front of each match'],['-c','print only how many lines match']],
  e:[['grep cd todo.txt','lines containing cd'],['ls | grep txt','entries with txt in the name']], see:'find, sort, wc'},
 sort:{n:'sort lines', s:['sort [-r] [-n] [-u] [FILE]...'], d:['Prints the lines of each FILE, or of what comes in through a pipe, in order.'], o:[['-r','reverse order'],['-n','compare as numbers, so 9 comes before 10'],['-u','print each line only once']],
  e:[['sort names.txt','alphabetical order'],['sort -n scores.txt','numerical order']], see:'uniq, wc'},
 uniq:{n:'drop repeated lines', s:['uniq [-c] [FILE]'], d:['Prints the lines of FILE, leaving out a line when it is the same as the one just before it. Use sort first so that equal lines sit together.'], o:[['-c','put the number of repeats in front of each line']],
  e:[['sort names.txt | uniq -c','how many times each name appears']], see:'sort'},
 cut:{n:'print selected parts of each line', s:['cut -d DELIMITER -f FIELDS [FILE]...'], d:['Splits each line wherever DELIMITER appears and prints only the FIELDS you ask for, counted from 1.'],
  o:[['-d DELIMITER','the character that separates the fields, for example , or :'],['-f FIELDS','which fields to print, for example 1 or 1,3']], e:[['cut -d , -f 1 people.csv','the first column of a CSV file']], see:'grep, sort'},
 find:{n:'search for files in a folder tree', s:['find [FOLDER]... [-name PATTERN] [-type f|d]'], d:['Walks through each FOLDER and everything inside it, printing the path of every entry that matches. With no FOLDER, starts from the current folder, written as .'],
  o:[['-name PATTERN','only names that match PATTERN; * matches anything, so "*.txt" means every name ending in .txt'],['-type f','only files'],['-type d','only folders']],
  e:[['find . -name "*.txt"','every .txt file from here down'],['find ~ -type d','every folder in your home']], see:'ls, grep, tree'},
 tree:{n:'show folders and files as a tree', s:['tree [-a] [-d] [-F] [-L LEVEL] [FOLDER]...'], d:['Draws each FOLDER and everything inside it as a tree, with lines showing what is inside what. With no FOLDER, starts from the folder you are in, written as .','At the end it counts the folders and files it showed. Names that start with a dot are hidden unless you use -a.','tree does not come with Ubuntu or macOS. On your own laptop, install it first: sudo apt install tree on Ubuntu, or brew install tree on a Mac.'],
  o:[['-a','show everything, including hidden names that start with a dot'],['-d','show folders only'],['-F','put / after each folder and * after each program'],['-L LEVEL','go only LEVEL levels deep; tree -L 1 shows just what is directly inside']],
  e:[['tree','everything from here down'],['tree -L 1 ~','just the top level of your home folder'],['tree -d /','only the folders, starting from the root']], see:'ls, find'},
 echo:{n:'print a line of text', s:['echo [TEXT]...'], d:['Prints its words, separated by spaces, then a new line. With > it writes them into a file instead; with >> it adds them to the end.','Words like $HOME are replaced by their value first, unless they are inside single quotes.'],
  e:[['echo "Hello"','prints Hello'],['echo "Practise cd every day" > todo.txt','writes the line into todo.txt'],['echo $HOME','prints the path of your home folder']], see:'printf, cat'},
 printf:{n:'print formatted text', s:['printf FORMAT [ARGUMENT]...'], d:['Prints FORMAT, replacing each %s with the next ARGUMENT and each %d with the next number. \\n starts a new line and \\t is a tab. Unlike echo, printf adds no new line unless you ask for one.'],
  e:[['printf "%s is %d\\n" Ada 36','prints Ada is 36']], see:'echo'},
 date:{n:'print the date and time', s:['date'], d:['Prints the current date and time, including the time zone.'], see:'sleep'},
 whoami:{n:'print your username', s:['whoami'], d:['Prints the name of the user you are logged in as.'], see:'id'},
 id:{n:'print your user and group numbers', s:['id'], d:['Prints your user number (uid), your main group (gid), and every group you belong to. Groups decide who can open what, alongside the permissions shown by ls -l.'], see:'whoami, chmod, ls'},
 which:{n:'show where a command lives', s:['which COMMAND...'], d:['Prints the full path of the program that runs when you type COMMAND. Prints nothing for commands built into the shell, like cd.'], e:[['which ls','for example /usr/bin/ls']], see:'man'},
 chmod:{n:'change who can read, write or run a file', s:['chmod MODE FILE...','chmod [ugoa][+-=][rwx] FILE...'], d:['Every file and folder has three sets of permissions: for its owner (u), its group (g), and everyone else (o). Each set says whether they may read (r), write (w), and run or enter (x). ls -l shows them, for example rw-r--r--.','MODE can be letters, like u+x or go-w, or three digits, one per set, where read is 4, write is 2 and run is 1: so 6 means rw- and 7 means rwx.','Only the owner can change a file\'s permissions.'],
  o:[['u g o a','owner, group, others, or all three'],['+  -  =','add, remove, or set exactly'],['r w x','read, write, run (for a folder: enter it)']],
  e:[['chmod 600 secret.txt','only you can read or write it'],['chmod u-w todo.txt','stop yourself writing to it'],['chmod 755 tools','everyone can enter; only you can change it']], see:'ls, id'},
 ps:{n:'list the programs that are running', s:['ps'], d:['Prints one line for each process started from this terminal: its process ID (PID), the terminal it belongs to, how much processor time it has used, and its command.'], e:[['ps','your shell, any background jobs, and ps itself']], see:'kill, jobs, sleep'},
 kill:{n:'stop a process', s:['kill [-9] PID...','kill %JOB'], d:['Sends a signal to each process, asking it to stop. Find the PID with ps, or use %1 for job 1 from jobs.'], o:[['-9','stop it immediately, without asking nicely']], e:[['sleep 100 &','start a background job'],['kill %1','stop job 1']], see:'ps, jobs'},
 sleep:{n:'wait for a number of seconds', s:['sleep SECONDS'], d:['Does nothing for SECONDS seconds, then finishes. Useful for practising with processes: stop it with Ctrl + C, or run it in the background with &.'], e:[['sleep 5','wait five seconds'],['sleep 100 &','wait in the background']], see:'ps, kill, jobs'},

    dotAt = [p.A[0] + (p.B[0] - p.A[0]) * f, p.A[1] + (p.B[1] - p.A[1]) * f];
    dotEl.setAttribute('cx', dotAt[0]); dotEl.setAttribute('cy', dotAt[1]); dotEl.setAttribute('visibility', 'visible');
    trail.pts = plan.slice(0, i + 1).map(q => q.A).concat([dotAt]); if (trailEl) trailEl.setAttribute('d', trailD(trail.pts));
    if (now - t0 < dur) anim = requestAnimationFrame(step); else finish();
  };
  anim = requestAnimationFrame(step);
}

/* ---------- controls ---------- */
function greet(){ line('A practice terminal. Type a command and press Enter, and the tree on the right shows every change as it happens. You can look anywhere, but only change things inside your home folder. Type help for the commands, or man ls to read a manual.', 'note'); }
function rebuild(keepHome){
  const parentOfHomes = buildRoot();
  if (!keepHome){ S.home = mk(S.user, true); add(S.home, mk('projects', true)); }
  S.home.name = S.user; add(parentOfHomes, S.home);
}
function reset(){
  [...S.jobs, ...(S.fg ? [S.fg] : [])].forEach(j => { clearTimeout(j.timer); j.state = 'Done'; try { j.gen.return(); } catch {} });
  E = MAIN = newEnv(); TIO.fd = { 0:null, 1:TERM, 2:ERRT }; IO = TIO; CUR = null; TERM.open = null;
  S.id = 1; S.home = null; rebuild(false);
  S.cwd = S.shown = S.home; S.cont = null; S.ctx = []; S.asking = null; S.inputJob = null; S.fg = null; S.toldSudo = false; S.toldStdin = false;
  S.jobs = []; S.notices = []; S.joiners.clear(); S.lastBg = 0;
  if (S.pager){ S.pager.el.remove(); S.pager = null; }
  if (S.editor){ S.editor.el.remove(); S.editor = null; }
  term.classList.remove('full');
  out.textContent = ''; greet(); status(''); render(); showPrompt();
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  if (S.os === b.dataset.os) return;
  S.os = b.dataset.os; document.body.classList.toggle('mac', mac());
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  const wasHome = mine(S.cwd);
  if (S.home.parent) detach(S.home);
  rebuild(true);
  if (!wasHome){ S.cwd = S.shown = S.home; }
  S.prev = null;
  render(); showPrompt(); cmd.focus();
}));
$('perms').addEventListener('click', (e) => { S.perms = !S.perms; e.currentTarget.setAttribute('aria-pressed', String(S.perms)); render(); cmd.focus(); });
$('user').addEventListener('input', (e) => {
  const v = e.target.value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') || 'yourname';
  S.user = v; if (S.home){ S.home.name = v; S.home.parent.kids.sort((a,b) => a.name.localeCompare(b.name)); } render(); showPrompt();
});
$('reset').addEventListener('click', () => { reset(); cmd.focus(); });
addEventListener('resize', () => { render(); if (S.pager) pagerDraw(); });
reset(); cmd.focus();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>
